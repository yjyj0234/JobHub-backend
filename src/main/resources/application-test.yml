spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  config:
    import:
    - "optional:classpath:application-secret.yml"

# JWT 설정
jwt:
  secret: am9iaHVidGVzdGp3dHNlY3JldGtleWZvcmRldmVsb3BtZW50
  access-token-validity-in-seconds: 86400
  refresh-token-validity-in-seconds: 604800

# AWS S3 설정 (테스트용)
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-bucket
    credentials:
      access-key: test-key
      secret-key: test-secret

logging:
  level:
    root: INFO
    boot.data: DEBUG
