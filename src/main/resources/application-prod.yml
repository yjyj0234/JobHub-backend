server:
  port: 8080
  address: 0.0.0.0

spring:
  profiles:
    active: prod
  
  datasource:
    # 운영 환경에서는 환경 변수로 주입하는 것을 권장
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://finalproject.c3m0eoo0uhk9.ap-northeast-2.rds.amazonaws.com:3306/final?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:tkddyd04}
    password: ${DB_PASSWORD:Tkddyd04!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: 8080

# 로깅 설정 (운영환경)
logging:
  level:
    root: INFO
    boot.data: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/application.log
    max-size: 100MB
    max-history: 30

# JWT 설정 (환경 변수로 주입 권장)
jwt:
  secret: ${JWT_SECRET:123456789012345678901234567890123456789}
  expiration: ${JWT_EXPIRATION:86400000}
